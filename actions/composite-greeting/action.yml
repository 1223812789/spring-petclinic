name: Composite Greeting

description: Greet a user, compute a random number, and run a goodbye script

inputs:
  who-to-greet:
    description: Name to greet
    required: true

outputs:
  random-number:
    description: A random number generated by the action
    value: ${{ steps.random.outputs.random-number }}

runs:
  using: composite
  steps:
    - name: Greet user
      shell: bash
      run: echo "Hello, ${{ inputs.who-to-greet }}!"

    - name: Generate random number
      id: random
      shell: bash
      run: |
        number=$RANDOM
        echo "random-number=${number}" >> "$GITHUB_OUTPUT"
        echo "Generated random number: ${number}"

    - name: Add script to PATH
      shell: bash
      run: echo "$GITHUB_WORKSPACE/actions/composite-greeting" >> "$GITHUB_PATH"

    - name: Run local goodbye script
      shell: bash
      run: goodbye.sh
