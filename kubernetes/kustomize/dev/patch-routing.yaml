apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic
spec:
  template:
    spec:
      containers:
        - name: petclinic
          env:
            - name: SERVER_SERVLET_CONTEXT_PATH
              value: /tp7
          startupProbe:
            httpGet:
              path: /tp7/actuator/health
              port: 8080
          livenessProbe:
            httpGet:
              path: /tp7/actuator/health/liveness
              port: 8080
          readinessProbe:
            httpGet:
              path: /tp7/actuator/health/readiness
              port: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: petclinic-ingress
spec:
  rules:
    - host: localhost
      http:
        paths:
          - path: /tp7
            pathType: Prefix
            backend:
              service:
                name: petclinic-service
                port:
                  number: 8080
