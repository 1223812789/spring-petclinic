name: Push PetClinic Image to GHCR

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Get Maven version from pom.xml
        id: get_version
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse('pom.xml').getroot()
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          version = root.findtext('m:version', namespaces=ns)
          if version is None or version == '':
              version = root.findtext('m:parent/m:version', namespaces=ns)
          if version is None or version == '':
              raise SystemExit('Could not determine project version from pom.xml')

          output_path = os.environ.get('GITHUB_OUTPUT')
          if not output_path:
              raise SystemExit('GITHUB_OUTPUT is not defined')

          with open(output_path, 'a', encoding='utf-8') as f:
              f.write(f'version={version}\n')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Normalize GitHub owner for GHCR
        id: ghcr_owner
        run: echo "owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and tag Docker image with Spring Boot
        run: |
          ./mvnw spring-boot:build-image \
            -DskipTests \
            -Dspring-boot.build-image.imageName=ghcr.io/${{ steps.ghcr_owner.outputs.owner }}/spring-petclinic:${{ steps.get_version.outputs.version }}

      - name: Add additional tags
        run: |
          docker tag ghcr.io/${{ steps.ghcr_owner.outputs.owner }}/spring-petclinic:${{ steps.get_version.outputs.version }} \
            ghcr.io/${{ steps.ghcr_owner.outputs.owner }}/spring-petclinic:${{ github.sha }}
          docker tag ghcr.io/${{ steps.ghcr_owner.outputs.owner }}/spring-petclinic:${{ steps.get_version.outputs.version }} \
            ghcr.io/${{ steps.ghcr_owner.outputs.owner }}/spring-petclinic:main
          docker tag ghcr.io/${{ steps.ghcr_owner.outputs.owner }}/spring-petclinic:${{ steps.get_version.outputs.version }} \
            ghcr.io/${{ steps.ghcr_owner.outputs.owner }}/spring-petclinic:latest

      - name: Push tags to GHCR
        run: |
          docker push ghcr.io/${{ steps.ghcr_owner.outputs.owner }}/spring-petclinic:${{ steps.get_version.outputs.version }}
          docker push ghcr.io/${{ steps.ghcr_owner.outputs.owner }}/spring-petclinic:${{ github.sha }}
          docker push ghcr.io/${{ steps.ghcr_owner.outputs.owner }}/spring-petclinic:main
          docker push ghcr.io/${{ steps.ghcr_owner.outputs.owner }}/spring-petclinic:latest

  update-gitops:
    needs: push-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: 1223812789/kustomize
          token: ${{ secrets.GITOPS_PAT }}
          path: infra-repo

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: 5.4.2

      - name: Update the image tag
        working-directory: infra-repo/dev
        run: |
          kustomize edit set image ghcr.io/1223812789/spring-petclinic=ghcr.io/1223812789/spring-petclinic:${{ github.sha }}

      - name: Commit and push GitOps update
        working-directory: infra-repo
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add dev/kustomization.yaml
          if git diff --cached --quiet; then
            echo "GitOps image already points to this commit; nothing to commit."
            exit 0
          fi
          git commit -m "Auto-update image to tag ${{ github.sha }}"
          git push origin HEAD:main
