name: Push PetClinic Image to GHCR

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Get Maven version from pom.xml
        id: get_version
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse('pom.xml').getroot()
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          version = root.findtext('m:version', namespaces=ns)
          if version is None or version == '':
              version = root.findtext('m:parent/m:version', namespaces=ns)
          if version is None or version == '':
              raise SystemExit('Could not determine project version from pom.xml')

          output_path = os.environ.get('GITHUB_OUTPUT')
          if not output_path:
              raise SystemExit('GITHUB_OUTPUT is not defined')

          with open(output_path, 'a', encoding='utf-8') as f:
              f.write(f'version={version}\n')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Normalize GitHub owner for GHCR
        id: ghcr_owner
        run: echo "owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and tag Docker image with Spring Boot
        run: |
          ./mvnw spring-boot:build-image \
            -DskipTests \
            -Dspring-boot.build-image.imageName=ghcr.io/${{ steps.ghcr_owner.outputs.owner }}/spring-petclinic:${{ steps.get_version.outputs.version }}

      - name: Add additional tags
        run: |
          docker tag ghcr.io/${{ steps.ghcr_owner.outputs.owner }}/spring-petclinic:${{ steps.get_version.outputs.version }} \
            ghcr.io/${{ steps.ghcr_owner.outputs.owner }}/spring-petclinic:${{ github.sha }}
          docker tag ghcr.io/${{ steps.ghcr_owner.outputs.owner }}/spring-petclinic:${{ steps.get_version.outputs.version }} \
            ghcr.io/${{ steps.ghcr_owner.outputs.owner }}/spring-petclinic:latest

      - name: Push tags to GHCR
        run: |
          docker push ghcr.io/${{ steps.ghcr_owner.outputs.owner }}/spring-petclinic:${{ steps.get_version.outputs.version }}
          docker push ghcr.io/${{ steps.ghcr_owner.outputs.owner }}/spring-petclinic:${{ github.sha }}
          docker push ghcr.io/${{ steps.ghcr_owner.outputs.owner }}/spring-petclinic:latest
